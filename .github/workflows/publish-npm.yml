name: Publish To npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Package
        run: npm run prepack

      - name: Check If Version Is Already Published
        id: version_check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXACT_PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || echo "")
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_VERSION" = "$EXACT_PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is already published."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing version $PACKAGE_VERSION."
          fi

      - name: Publish To npm
        if: steps.version_check.outputs.should_publish == 'true'
        shell: bash
        run: |
          PACKAGE_NAME="${{ steps.version_check.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.version_check.outputs.package_version }}"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt for $PACKAGE_NAME@$PACKAGE_VERSION"

            if npm publish --access public --provenance; then
              echo "Publish succeeded."
              exit 0
            fi

            if [ "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || echo "")" = "$PACKAGE_VERSION" ]; then
              echo "Version is already visible on npm; treating as success."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Publish not yet accepted by npm registry, retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Publish failed after retries."
          exit 1

      - name: Publish Summary
        run: |
          echo "Package: ${{ steps.version_check.outputs.package_name }}"
          echo "Version: ${{ steps.version_check.outputs.package_version }}"
          echo "Published: ${{ steps.version_check.outputs.should_publish }}"
